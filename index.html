<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Práctica de Clase de GitHub</title>

        <style>
            body { 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: yellow; 
            margin: 0;
            transition: background-color 1s;
            overflow: hidden;
        }

        .card { 
            background: white; 
            padding: 2rem; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 300px; 
            text-align: center;
            position: relative;
            z-index: 10;
        }

        input { 
            width: 90%; 
            padding: 10px; 
            margin: 10px 0; 
            border: 1px solid #ccc; 
            border-radius: 5px;
        }

        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: .3s;
        }

        button:hover { 
            background: #0056b3;
        }

        #mensaje { 
            margin-top: 15px; 
            font-weight: bold;
        }


        /* Estilo de los fuegos artificiales */

        .fuego {

            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: orange;
            animation: explosion 1s forwards;

        }


        @keyframes explosion {

            0% {
                transform: scale(0);
                opacity: 1;
            }


            100% {
                transform: scale(8);
                opacity: 0;
            }

        }


        /* Estilo de las caritas felices parpadeantes */

        .carita {

            position: absolute;
            font-size: 2rem;
            animation: parpadeo 1.5s ease-in-out forwards;
            pointer-events: none;

        }


        @keyframes parpadeo {

            0%, 100% {
                opacity: 0;
            }

            15%, 45%, 75% {
                opacity: 1;
            }

            30%, 60%, 90% {
                opacity: 0.1;
            }

        }

        </style>

    </head>

    <body>
        <div class="card">

            <h2>Bienvenido</h2>

            <p>Ingresa tu nombre para continuar</p>

            <input 
                type="text" 
                id="nombreUsuario" 
                placeholder="Escribe tu nombre..."
            >

            <button id="btnSaludar">
                Saludar
            </button>

            <div id="mensaje"></div>

        </div>

    <script>
            // -------------------------------
    // Función original del saludo
    // -------------------------------

    document.getElementById('btnSaludar')
    .addEventListener('click', function() {


        const nombre = document
            .getElementById('nombreUsuario')
            .value;


        const display = document
            .getElementById('mensaje');


        if (nombre.trim() === "") {


            display.innerText = 
                "⚠️ Por favor, escribe algo.";

            display.style.color = "red";


        } else {


            display.innerText = 
                "¡Hola, " + nombre + 
                "! Éxito en tu práctica de Git.";


            display.style.color = "green";

        }


    });




    // -------------------------------
    // Cambio automático de colores
    // -------------------------------


    const colores = [
        "yellow",
        "green",
        "blue"
    ];


    let posicionColor = 0;



    setInterval(function() {


        document.body.style.backgroundColor = 
            colores[posicionColor];


        posicionColor++;


        if (posicionColor >= colores.length) {

            posicionColor = 0;

        }


    }, 1000);






    // -------------------------------
    // Fuegos artificiales
    // -------------------------------


    function crearFuego() {


        const fuego = document.createElement("div");


        fuego.className = "fuego";


        fuego.style.left = 
            Math.random() * window.innerWidth + "px";


        fuego.style.top = 
            Math.random() * window.innerHeight + "px";



        document.body.appendChild(fuego);



        setTimeout(function() {

            fuego.remove();

        }, 1000);


    }



    setInterval(crearFuego, 500);




    // -------------------------------
    // Caritas felices parpadeantes
    // -------------------------------


    const emojis = ["😀", "😃", "😄", "😁", "🙂"];


    function crearCarita() {


        const carita = document.createElement("div");


        carita.className = "carita";


        carita.innerText =
            emojis[Math.floor(Math.random() * emojis.length)];


        carita.style.left =
            Math.random() * window.innerWidth + "px";


        carita.style.top =
            Math.random() * window.innerHeight + "px";



        document.body.appendChild(carita);



        setTimeout(function() {

            carita.remove();

        }, 1500);


    }



    setInterval(crearCarita, 600);

    </script>


    </body>
</html>
